name: Release APK (ru)

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number override (versionCode). Empty = from pubspec."
        required: false
        type: string
      release_tag:
        description: "Create a GitHub Release with this tag (e.g. v2.3.6-ru1). Empty = artifacts only."
        required: false
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      # The release keystore lives in repo secrets, never in the tree. Without
      # the secrets the build still succeeds, signed with the debug key — fine
      # for testing, but an update over a release-signed install then needs an
      # uninstall (which wipes the user's account and history).
      - name: Configure release signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No KEYSTORE_BASE64 secret — building with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Bump build number (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_number != '' }}
        run: |
          sed -i -E "s/^(version: [0-9]+\.[0-9]+\.[0-9]+\+)[0-9]+/\1${{ inputs.build_number }}/" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APKs
        env:
          # The proprietary Discord SDK is gitignored, so CI builds without it
          # (same switch the upstream nightly uses).
          ZANGETSU_NO_DISCORD: "1"
          # Tracker OAuth apps: keep the credentials out of the tree and inject
          # them as compile-time defines. Absent secrets => empty strings, and
          # the app is expected to hide/disable that tracker.
          SHIKIMORI_CLIENT_ID: ${{ secrets.SHIKIMORI_CLIENT_ID }}
          SHIKIMORI_CLIENT_SECRET: ${{ secrets.SHIKIMORI_CLIENT_SECRET }}
        run: >-
          flutter build apk --release --split-per-abi
          --dart-define=SHIKIMORI_CLIENT_ID=$SHIKIMORI_CLIENT_ID
          --dart-define=SHIKIMORI_CLIENT_SECRET=$SHIKIMORI_CLIENT_SECRET

      - name: Collect APKs
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "out/Zangetsu-$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+/_/')-tv-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "out/Zangetsu-$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+/_/')-phone-arm64-v8a.apk"
          ls -l out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zangetsu-ru-apk
          path: out/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') || startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release create "$TAG" out/*.apk \
            --title "Zangetsu $TAG" \
            --notes "Русская сборка Zangetsu. ТВ/приставки — armeabi-v7a, телефоны/планшеты — arm64-v8a." \
            --generate-notes || \
          gh release upload "$TAG" out/*.apk --clobber
